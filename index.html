<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>월드컵 피파랭킹 및 성적 예측기</title>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCMzm2JFY6jhh3HHa0N3hOw-tRVLjVSN6U",
      authDomain: "worldcup-ai-predictor.firebaseapp.com",
      databaseURL: "https://worldcup-ai-predictor-default-rtdb.firebaseio.com",
      projectId: "worldcup-ai-predictor",
      storageBucket: "worldcup-ai-predictor.appspot.com",
      messagingSenderId: "884291464852",
      appId: "1:884291464852:web:baded9580cf530e3af0e81"
    };

    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKZZxH72Ry7-oCB2Lzv7KrNsVf8aVHOy72Fob6_BtHUlvKSyitcXGhPam85QQhVYJHug/exec';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('main-section').style.display = 'block';
        document.getElementById('user-name').innerText = "⚽ " + user.displayName + "님 환영합니다!";
      } else {
        currentUser = null;
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('main-section').style.display = 'none';
      }
    });

    window.login = () => signInWithPopup(auth, provider).catch(err => alert("로그인 실패: " + err.message));
    window.logout = () => signOut(auth);

    window.predictWorldCup = () => {
      const country = document.getElementById('country-input').value.trim();
      if (!country) return alert("국가를 입력하세요!");

      document.getElementById('result').innerText = "데이터를 분석하고 있습니다...";

      fetch(`${APPS_SCRIPT_URL}?country=${encodeURIComponent(country)}`)
        .then(res => res.text())
        .then(responseText => {
          document.getElementById('result').innerText = responseText;

          window.speechSynthesis.cancel();
          const utterance = new SpeechSynthesisUtterance(responseText);
          utterance.lang = 'ko-KR';
          window.speechSynthesis.speak(utterance);

          if (currentUser) {
            push(ref(db, 'searches/' + currentUser.uid), {
              userName: currentUser.displayName,
              country: country,
              result: responseText,
              timestamp: new Date().toISOString()
            });
          }
        })
        .catch(err => {
          document.getElementById('result').innerText = "오류가 발생했습니다: " + err.message;
        });
    };
  </script>
</head>
<body style="font-family: Arial, sans-serif; padding: 20px; text-align: center; background-color: #f4f6f9;">

  <h1>🏆 월드컵 피파랭킹 및 성적 예측기 ⚽</h1>
  <p style="color: #666;">수행평가 제출용 프로그램 (인증/구조화 데이터 연동/TTS)</p>
  <hr style="border: 1px solid #ddd; max-width: 600px;">

  <div id="login-section" style="margin-top: 50px;">
    <p>서비스를 이용하려면 구글 로그인이 필요합니다.</p>
    <button onclick="login()" style="padding: 12px 24px; font-size: 16px; cursor: pointer; background-color: #4285F4; color: white; border: none; border-radius: 5px; font-weight: bold;">
      구글 계정으로 로그인
    </button>
  </div>

  <div id="main-section" style="display:none; max-width: 600px; margin: 30px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.05);">
    <h3 id="user-name" style="color: #333;"></h3>
    <button onclick="logout()" style="padding: 6px 12px; background:#6c757d; color:white; border:none; border-radius:4px; cursor:pointer; font-size: 13px;">로그아웃</button>
    <br><br>

    <div style="margin: 20px 0;">
      <input type="text" id="country-input" placeholder="예: 대한민국, 프랑스, 브라질"
        style="padding: 12px; font-size: 16px; width: 250px; border: 1px solid #ccc; border-radius: 4px;"
        onkeydown="if(event.key==='Enter') predictWorldCup()">
      <button onclick="predictWorldCup()"
        style="padding: 12px 20px; font-size: 16px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-left: 6px;">
        조회 및 예측
      </button>
    </div>

    <h3 style="margin-top: 40px; text-align: left; color: #222;">📊 분석 결과</h3>
    <div id="result"
      style="padding:20px; background:#f8f9fa; border: 1px solid #eee; border-radius:6px; min-height:60px; font-size: 16px; line-height: 1.6; color: #444; text-align: left;">
      국가명을 입력하고 버튼을 누르면 피파랭킹과 성적 예측 결과를 음성(TTS)으로 들려줍니다.
    </div>
  </div>

</body>
</html>
